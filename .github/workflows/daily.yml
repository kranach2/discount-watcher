name: Daily price watch

on:
  schedule:
    # GitHub Actions cron is in UTC. 4pm Perth (AWST = UTC+8) = 08:00 UTC.
    # Perth doesn't observe daylight savings, so this stays right year-round.
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # also let me trigger it manually from the Actions tab

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed if we want to commit updated price_history.json back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: bash run_daily.sh

      - name: Commit updated price history
        # So tomorrow's run can see today's prices. Uses the default GITHUB_TOKEN.
        run: |
          if [[ -n "$(git status --porcelain data/price_history.json)" ]]; then
            git config user.name  "woolies-watcher-bot"
            git config user.email "actions@github.com"
            git add data/price_history.json
            git commit -m "chore: update price history $(date -u +%Y-%m-%d)"
            git push
          fi
